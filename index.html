<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Counter-Strike 1.6: Telegram Edition</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg-dark: #121216;
            --cs-yellow: #d9bc67;
            --cs-orange: #e08b24;
            --cs-panel: rgba(26, 26, 36, 0.95);
            --text-main: #ffffff;
        }
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Tahoma', sans-serif;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }
        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            overflow: hidden;
            width: 100vw;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }
        .hud {
            position: absolute;
            top: 0; left: 0; width: 100%;
            display: flex;
            justify-content: space-between;
            padding: 8px 12px;
            background: linear-gradient(to bottom, rgba(0,0,0,0.8), transparent);
            z-index: 20;
            font-size: 14px;
            font-weight: bold;
            text-shadow: 1px 1px 2px #000;
        }
        .hud-group { display: flex; gap: 15px; }
        .money { color: #2ecc71; }
        .timer { color: var(--cs-yellow); }
        .score { color: #3498db; }

        #gameCanvas {
            display: block;
            background: #2b2b2b;
            touch-action: none;
            flex: 1;
        }

        .buy-menu {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            background: var(--cs-panel);
            border: 2px solid var(--cs-yellow);
            border-radius: 8px;
            padding: 15px;
            width: 280px;
            display: none;
            z-index: 100;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
        }
        .buy-menu h3 {
            text-align: center;
            color: var(--cs-yellow);
            margin-bottom: 10px;
            font-size: 16px;
        }
        .buy-btn {
            background: #222;
            color: #fff;
            border: 1px solid #444;
            padding: 8px;
            width: 100%;
            margin-bottom: 6px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 13px;
            text-align: left;
            display: flex;
            justify-content: space-between;
        }
        .buy-btn:hover { background: #333; border-color: var(--cs-yellow); }

        /* Кнопки движения (D-Pad) слева */
        .dpad-container {
            position: absolute;
            bottom: 20px; left: 20px;
            width: 150px; height: 150px;
            z-index: 10;
            pointer-events: auto;
        }
        .d-btn {
            position: absolute;
            background: rgba(255, 255, 255, 0.12);
            border: 2px solid rgba(255, 255, 255, 0.3);
            color: #fff;
            font-weight: bold;
            font-size: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 12px;
            backdrop-filter: blur(4px);
        }
        .d-btn:active { background: rgba(217, 188, 103, 0.5); border-color: var(--cs-yellow); }
        .btn-up { top: 0; left: 50px; width: 50px; height: 50px; }
        .btn-down { bottom: 0; left: 50px; width: 50px; height: 50px; }
        .btn-left { top: 50px; left: 0; width: 50px; height: 50px; }
        .btn-right { top: 50px; right: 0; width: 50px; height: 50px; }

        /* Кнопки действий справа */
        .action-buttons {
            position: absolute;
            bottom: 25px; right: 20px;
            display: flex;
            gap: 12px;
            align-items: center;
            z-index: 10;
            pointer-events: auto;
        }
        .action-btn {
            width: 60px; height: 60px;
            background: rgba(20, 20, 25, 0.7);
            border: 2px solid var(--cs-yellow);
            border-radius: 50%;
            color: #fff;
            font-size: 11px;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }
        .action-btn:active { background: var(--cs-yellow); color: #000; }
        
        .fire-btn {
            width: 85px; height: 85px;
            background: rgba(224, 139, 36, 0.85);
            border-color: #fff;
            font-size: 15px;
        }

        .buy-toggle-btn {
            position: absolute;
            top: 50px; right: 15px;
            background: var(--cs-orange);
            color: #000;
            border: none;
            padding: 8px 14px;
            font-weight: bold;
            border-radius: 6px;
            z-index: 25;
            cursor: pointer;
            box-shadow: 0 3px 10px rgba(0,0,0,0.4);
        }
    </style>
</head>
<body>

    <div class="hud">
        <div class="hud-group">
            <span class="score">Т: <span id="tScore">0</span> | КТ: <span id="ctScore">0</span></span>
            <span class="timer" id="roundTimer">1:55</span>
        </div>
        <div class="hud-group">
            <span class="money" id="playerMoney">$800</span>
            <span id="ammoText">12 / 36</span>
        </div>
    </div>

    <button class="buy-toggle-btn" onclick="toggleBuyMenu()">🛒 ЗАКУПКА (B)</button>

    <canvas id="gameCanvas"></canvas>

    <div class="buy-menu" id="buyMenu">
        <h3>ARMS RACE SHOP</h3>
        <button class="buy-btn" onclick="buyWeapon('usp', 200)"><span>USP-S / Glock</span><span>$200</span></button>
        <button class="buy-btn" onclick="buyWeapon('mp5', 1500)"><span>MP5 Navy SMG</span><span>$1500</span></button>
        <button class="buy-btn" onclick="buyWeapon('ak47', 2700)"><span>AK-47 / M4A1</span><span>$2700</span></button>
        <button class="buy-btn" onclick="buyWeapon('awp', 4750)"><span>AWP Sniper Rifle</span><span>$4750</span></button>
        <button class="buy-btn" onclick="toggleBuyMenu()" style="background:#555; text-align:center; justify-content:center; margin-top:10px;">Закрыть</button>
    </div>

    <!-- Кнопочное управление (D-Pad) слева -->
    <div class="dpad-container">
        <div class="d-btn btn-up" id="btnUp">▲</div>
        <div class="d-btn btn-left" id="btnLeft">◀</div>
        <div class="d-btn btn-right" id="btnRight">▶</div>
        <div class="d-btn btn-down" id="btnDown">▼</div>
    </div>

    <!-- Кнопки справа -->
    <div class="action-buttons">
        <div class="action-btn" onclick="reloadWeapon()">RELOAD</div>
        <div class="action-btn fire-btn" id="fireBtn">FIRE</div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        let money = 800;
        let tScore = 0;
        let ctScore = 0;
        let playerWeapon = 'usp';
        let ammo = 12;
        let reserveAmmo = 36;

        const weapons = {
            usp: { damage: 25, fireRate: 350, reloadTime: 1800, maxClip: 12, range: 400 },
            mp5: { damage: 18, fireRate: 120, reloadTime: 2200, maxClip: 30, range: 450 },
            ak47: { damage: 38, fireRate: 180, reloadTime: 2500, maxClip: 30, range: 600 },
            awp: { damage: 110, fireRate: 1200, reloadTime: 3000, maxClip: 10, range: 800 }
        };

        let player = {
            x: canvas.width / 2,
            y: canvas.height / 2,
            radius: 16,
            speed: 4,
            angle: 0,
            health: 100
        };

        let bullets = [];
        let enemies = [];
        let lastShotTime = 0;
        let isFiring = false;

        // Состояние нажатия кнопок движения
        let input = { up: false, down: false, left: false, right: false };

        function setupButton(id, key) {
            const el = document.getElementById(id);
            el.addEventListener('pointerdown', (e) => { e.preventDefault(); input[key] = true; });
            el.addEventListener('pointerup', (e) => { e.preventDefault(); input[key] = false; });
            el.addEventListener('pointerleave', (e) => { e.preventDefault(); input[key] = false; });
        }

        setupButton('btnUp', 'up');
        setupButton('btnDown', 'down');
        setupButton('btnLeft', 'left');
        setupButton('btnRight', 'right');

        function spawnBots() {
            enemies = [];
            for (let i = 0; i < 4; i++) {
                enemies.push({
                    x: Math.random() * (canvas.width - 100) + 50,
                    y: Math.random() * 200 + 50,
                    radius: 16,
                    health: 100,
                    speed: 1.8
                });
            }
        }
        spawnBots();

        const fireBtn = document.getElementById('fireBtn');
        fireBtn.addEventListener('pointerdown', (e) => { e.preventDefault(); isFiring = true; });
        fireBtn.addEventListener('pointerup', (e) => { e.preventDefault(); isFiring = false; });
        fireBtn.addEventListener('pointerleave', (e) => { e.preventDefault(); isFiring = false; });

        function shoot() {
            const now = Date.now();
            const w = weapons[playerWeapon];
            if (now - lastShotTime < w.fireRate) return;
            if (ammo <= 0) {
                reloadWeapon();
                return;
            }

            ammo--;
            lastShotTime = now;
            updateHUD();

            const spread = (Math.random() - 0.5) * 0.08;
            bullets.push({
                x: player.x + Math.cos(player.angle) * 20,
                y: player.y + Math.sin(player.angle) * 20,
                vx: Math.cos(player.angle + spread) * 12,
                vy: Math.sin(player.angle + spread) * 12,
                damage: w.damage,
                range: w.range,
                traveled: 0
            });
        }

        function reloadWeapon() {
            if (reserveAmmo <= 0 || ammo >= weapons[playerWeapon].maxClip) return;
            setTimeout(() => {
                let needed = weapons[playerWeapon].maxClip - ammo;
                let take = Math.min(needed, reserveAmmo);
                ammo += take;
                reserveAmmo -= take;
                updateHUD();
            }, weapons[playerWeapon].reloadTime);
        }

        function toggleBuyMenu() {
            const menu = document.getElementById('buyMenu');
            menu.style.display = menu.style.display === 'block' ? 'none' : 'block';
        }

        function buyWeapon(wName, cost) {
            if (money >= cost) {
                money -= cost;
                playerWeapon = wName;
                ammo = weapons[wName].maxClip;
                reserveAmmo = weapons[wName].maxClip * 3;
                updateHUD();
                toggleBuyMenu();
            } else {
                alert("Недостаточно денег!");
            }
        }

        function updateHUD() {
            document.getElementById('playerMoney').innerText = `$${money}`;
            document.getElementById('ammoText').innerText = `${ammo} / ${reserveAmmo}`;
            document.getElementById('tScore').innerText = tScore;
            document.getElementById('ctScore').innerText = ctScore;
        }

        function update() {
            // Движение по кнопкам D-Pad
            if (input.up) player.y -= player.speed;
            if (input.down) player.y += player.speed;
            if (input.left) player.x -= player.speed;
            if (input.right) player.x += player.speed;

            player.x = Math.max(20, Math.min(canvas.width - 20, player.x));
            player.y = Math.max(20, Math.min(canvas.height - 20, player.y));

            // Поворот в сторону ближайшего врага
            if (enemies.length > 0) {
                let target = enemies[0];
                player.angle = Math.atan2(target.y - player.y, target.x - player.x);
            }

            if (isFiring) {
                shoot();
            }

            // Пули
            for (let i = bullets.length - 1; i >= 0; i--) {
                let b = bullets[i];
                b.x += b.vx;
                b.y += b.vy;
                b.traveled += Math.hypot(b.vx, b.vy);

                if (b.traveled > b.range || b.x < 0 || b.x > canvas.width || b.y < 0 || b.y > canvas.height) {
                    bullets.splice(i, 1);
                    continue;
                }

                for (let j = enemies.length - 1; j >= 0; j--) {
                    let en = enemies[j];
                    if (Math.hypot(b.x - en.x, b.y - en.y) < en.radius) {
                        en.health -= b.damage;
                        bullets.splice(i, 1);
                        if (en.health <= 0) {
                            enemies.splice(j, 1);
                            money += 300;
                            if (enemies.length === 0) {
                                ctScore++;
                                money += 3200;
                                setTimeout(spawnBots, 2000);
                            }
                        }
                        break;
                    }
                }
            }

            // Боты
            enemies.forEach(en => {
                let angleToPlayer = Math.atan2(player.y - en.y, player.x - en.x);
                en.x += Math.cos(angleToPlayer) * en.speed;
                en.y += Math.sin(angleToPlayer) * en.speed;

                if (Math.hypot(player.x - en.x, player.y - en.y) < player.radius + en.radius) {
                    player.health -= 0.5;
                    if (player.health <= 0) {
                        player.health = 100;
                        money = Math.max(400, money - 1500);
                        tScore++;
                        player.x = canvas.width / 2;
                        player.y = canvas.height / 2;
                    }
                }
            });
        }

        function draw() {
            ctx.fillStyle = '#1e1e24';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.strokeStyle = 'rgba(255,255,255,0.03)';
            ctx.lineWidth = 1;
            for (let x = 0; x < canvas.width; x += 40) {
                ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, canvas.height); ctx.stroke();
            }
            for (let y = 0; y < canvas.height; y += 40) {
                ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(canvas.width, y); ctx.stroke();
            }

            ctx.fillStyle = '#f1c40f';
            bullets.forEach(b => {
                ctx.beginPath();
                ctx.arc(b.x, b.y, 3, 0, Math.PI * 2);
                ctx.fill();
            });

            enemies.forEach(en => {
                ctx.save();
                ctx.translate(en.x, en.y);
                ctx.fillStyle = '#e74c3c';
                ctx.beginPath();
                ctx.arc(0, 0, en.radius, 0, Math.PI * 2);
                ctx.fill();
                ctx.lineWidth = 2;
                ctx.strokeStyle = '#c0392b';
                ctx.stroke();
                ctx.restore();
            });

            ctx.save();
            ctx.translate(player.x, player.y);
            ctx.rotate(player.angle);
            
            ctx.fillStyle = '#3498db';
            ctx.beginPath();
            ctx.arc(0, 0, player.radius, 0, Math.PI * 2);
            ctx.fill();
            ctx.lineWidth = 2;
            ctx.strokeStyle = '#2980b9';
            ctx.stroke();

            ctx.fillStyle = '#000';
            ctx.fillRect(0, -4, 22, 8);

            ctx.restore();
        }

        function loop() {
            update();
            draw();
            requestAnimationFrame(loop);
        }

        updateHUD();
        loop();

        if (window.Telegram && window.Telegram.WebApp) {
            window.Telegram.WebApp.ready();
            window.Telegram.WebApp.expand();
        }
    </script>
</body>
</html>
